name: tenure
version: 1.4.1
manifest_version: 2
api_version: 1
label: tenure
description: >-
  Your agent works without asking. When it gets a change wrong, you undo it, and from then on that kind of action is
  listed for you after each turn, with an undo. Edits through Hermes' file tools and plain file commands on project
  files (rm, mv, cp, sed -i, touch, > file, alone or chained) are saved before they run and can be undone for 24 hours
  (/tenure undo); everything else (a test run, a build, a commit, files changed by another program) can't be undone.
  After one mistake on a kind of action (an undo, a refusal, a flag, a file that no longer parses), its actions are
  listed at the end of the turn with an undo (a kind Tenure can't undo asks first); after a second, it asks first; a
  run of actions you keep frees it again. Pushes, publishing, uploads, messages to people and payments always ask;
  after outside content, the next command asks once. Three commands: /tenure, /tenure undo, /tenure trust. Opt-in
  study mode: the rule of a preregistered study, with spot checks, a guarantee you choose (Dodge's CSP-1) and a
  signed, tamper-evident autonomy passport. Local only: no network, no LLM call.
author: Otsoa Dubief
license: Apache-2.0
homepage: https://github.com/otsoa-dubief/tenure
tags: [approvals, autonomy, oversight, safety, statistics]
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks:
  - pre_api_request
  - pre_tool_call
  - post_approval_response
  - post_tool_call
  - post_llm_call
  - subagent_start
  - subagent_stop
config_schema:
  preset:
    type: str
    choices: [careful, balanced, fast]
    default: balanced
    description: "careful, balanced or fast: the accepted risk per stakes level (see `hermes tenure setup`)"
    required: false
  risks:
    type: dict
    default: {}
    description: "Your own risks per stakes level, over the preset: e.g. {low: 1/50, medium: 1%, high: cap}"
    required: false
  spot_check:
    type: float
    default: 0.1
    description: "Share of a cleared type's actions that still ask, at random (default one in ten)"
    required: false
  start:
    type: str
    choices: [trusted, probation]
    default: trusted
    description: "trusted: no question before a type's first mistake; probation: every type asks until it earns autonomy (the study's start)"
    required: false
  mode:
    type: str
    choices: [simple, study]
    default: simple
    description: "simple: acts freely, each action of a kind shown to you with an undo after its first mistake, asks after a second; study: the preregistered study's rule, with spot checks, guarantee and signed passport"
    required: false
  strict:
    type: bool
    default: false
    description: "On a model or provider change, start every kind over (a kind that made a mistake asks first again) instead of keeping its record as it stands (study mode: half of it, on trial)"
    required: false
  types:
    type: dict
    default: {}
    description: "Reclassify action types: {pattern: free|low|medium|high|cap}, e.g. {'mcp:notion:*': medium}"
    required: false
  fields:
    type: dict
    default: {}
    description: "Sensitive field categories: {enable: [...], disable: [...], add: {category: [field, ...]}, remove: {...}, stakes: {category: low|medium|high}}, e.g. {enable: [amount], stakes: {finance: medium}}"
    required: false
  enabled:
    type: bool
    default: true
    description: "Turn Tenure off without uninstalling it"
    required: false
